[package]
name = "mkfs-sysv"
version = "0.1.1"
edition = "2021"
rust-version = "1.85"
license = "WTFPL"
authors = ["Gareth Davidson <gaz@bitplane.net>"]
repository = "https://github.com/bitplane/mkfs-sysv"
homepage = "https://bitplane.net/dev/rust/mkfs-sysv"
description = "Create SVR4 (System V) filesystem images"
readme = "README.md"
keywords = ["sysv", "svr4", "filesystem", "mkfs"]
categories = ["command-line-utilities", "filesystem"]

[[bin]]
name = "mkfs-sysv"
path = "src/main.rs"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }

[dev-dependencies]
tempfile = "3"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
